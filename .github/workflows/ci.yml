name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch + torchvision, matched versions)
        run: |
          python -m pip install --upgrade pip
          # install torch AND torchvision from the same CPU index so their
          # versions match (mismatch -> "operator torchvision::nms does not exist")
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests app.py
      - name: Test
        run: pytest -q
